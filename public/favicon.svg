<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="leaf-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg-grad)" filter="url(#shadow)"/>
  
  <!-- Subtle Glowing Inner Border Ring -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-opacity="0.25"/>

  <!-- AI Radar Tech Rings (AgriSense Monitoring) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 8" opacity="0.35"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.25"/>

  <!-- Sun / AI Core Node -->
  <circle cx="330" cy="180" r="32" fill="url(#gold-accent)"/>
  <circle cx="330" cy="180" r="44" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.6"/>

  <!-- Sprout / Leaf & Tech Neural Lines -->
  <g transform="translate(0, 10)">
    <!-- Main Left Leaf -->
    <path d="M 256 380 C 175 330 135 240 150 160 C 220 150 310 210 256 380 Z" fill="url(#leaf-primary)"/>
    
    <!-- Right Leaf Overlay -->
    <path d="M 256 380 C 325 320 375 230 330 170 C 265 195 235 290 256 380 Z" fill="#10b981" opacity="0.92"/>
    
    <!-- Central AI Pulse Stem -->
    <path d="M 256 390 L 256 220 C 256 190 280 160 310 150" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- AI Neural Data Nodes -->
    <circle cx="256" cy="340" r="9" fill="#ffffff"/>
    <circle cx="256" cy="270" r="9" fill="#ffffff"/>
    <circle cx="280" cy="190" r="7" fill="#ffffff"/>
  </g>
</svg>